<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Girlfriend Day!</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #ffe6eb;
      font-family: 'Comic Sans MS', 'Arial', sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      color: #ff4d6d;
      font-size: 2.5rem;
      margin-bottom: 20px;
      padding: 0 15px;
    }

    .btn-container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      position: relative;
    }

    button {
      padding: 15px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 77, 109, 0.4);
    }

    #yesBtn:hover {
      transform: scale(1.1);
    }

    #noBtn {
      background-color: #a8a8a8;
      color: white;
      position: absolute;
      left: 120px; /* Offset next to Yes */
    }

    #successMessage {
      display: none;
      font-size: 2rem;
      color: #c9184a;
      animation: popIn 0.5s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div id="quizCard">
    <h1>Will you be my girlfriend? 💖</h1>
    <div class="btn-container">
      <button id="yesBtn" onclick="acceptProposal()">YES! 🌹</button>
      <button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No 😜</button>
    </div>
  </div>

  <div id="successMessage">
    🎉 Yay! Best decision ever! ❤️✨
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script>
    function moveNoButton() {
      const noBtn = document.getElementById('noBtn');
      // Calculate random coordinates based on screen bounds
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 100);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 100);
      
      noBtn.style.position = 'fixed';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }

    function acceptProposal() {
      document.getElementById('quizCard').style.display = 'none';
      const success = document.getElementById('successMessage');
      success.style.display = 'block';

      // Trigger colorful confetti explosion
      confetti({
        particleCount: 150,
        spread: 70,
        origin: { y: 0.6 }
      });
    }
  </script>
</body>
</html>
